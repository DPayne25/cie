[package]
name = "cie"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
csv = "1.4.0"
crc = {package = "crc", version = "3.0.0"}
cursor = "2.3.0"
dotenvy = "0.15.7"
futures = "0.3.31"
fxoanda = "0.2.0"
fxoanda_definitions = "=0.1.1"
openssl = "0.10.75"
postgres = "0.19.12"
reqwest = { version = "0.12.28", features = ["json"] }
rust_decimal = "1.40.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "=1.0.228"
serde_json = "=1.0.149"
sqlx = { version = "0.8.6", features = ["postgres", "chrono", "rust_decimal"] }
time = "=0.3.47"
tokio = { version = "1.48.0", features = ["full"] }
tokio-postgres = "0.7.15"
zip = "8.1.0"

