[package]
name = "sentinel_iaie"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.43"
csv = "1.4.0"
dotenvy = "0.15.7"
env_logger = "0.11.8"
futures = "0.3.31"
fxoanda = "0.1.3"
fxoanda_definitions = "=0.1.1"
lzma-rs = "0.3.0"
openssl = "0.10.75"
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "=1.0.228"
serde_json = "=1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "bigdecimal"] }
time = "0.3.46"
tokio = { version = "1.48.0", features = ["full"] }
zip = {version = "0.6.0", default-features = false, features = ["deflate"] }
